<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Klick Seite</title>
  <style>
    body{font-family:Arial, sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0}
    button{font-size:40px;padding:40px 80px;border:none;border-radius:20px;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,0.2)}
    #count{position:absolute;top:20px;font-size:24px}
  </style>
</head>
<body>
  <div id="count">Klicks: 0</div>
  <button onclick="addClick()">KLICK MICH</button>

  <script>
    let clicks = 0;
    function addClick(){
      clicks++;
      document.getElementById('count').innerText = 'Klicks: ' + clicks;
    }
  </script>
</body>
</html>
